<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 390" role="img" aria-label="Schematic of two phone screens: a crowded one with many small tiles and buttons, and the Simple mode Today screen with one card and one large Start button">
  <rect width="720" height="390" fill="#ffffff"/>
  <g font-family="Nunito, system-ui, sans-serif">
    <!-- busy -->
    <rect x="40" y="20" width="270" height="310" rx="26" fill="#ffffff" stroke="#1b2330" stroke-width="3"/>
    <rect x="56" y="38" width="238" height="22" rx="8" fill="#fff1e2"/>
    <g fill="#e5e7eb">
      <rect x="56" y="70" width="72" height="50" rx="8"/><rect x="138" y="70" width="72" height="50" rx="8"/><rect x="220" y="70" width="74" height="50" rx="8"/>
      <rect x="56" y="128" width="72" height="50" rx="8"/><rect x="138" y="128" width="72" height="50" rx="8"/><rect x="220" y="128" width="74" height="50" rx="8"/>
    </g>
    <g fill="#6b7484"><rect x="62" y="80" width="40" height="6" rx="3"/><rect x="144" y="80" width="46" height="6" rx="3"/><rect x="226" y="80" width="36" height="6" rx="3"/><rect x="62" y="138" width="44" height="6" rx="3"/><rect x="144" y="138" width="34" height="6" rx="3"/><rect x="226" y="138" width="44" height="6" rx="3"/></g>
    <g fill="#f28c28"><circle cx="116" cy="82" r="5"/><circle cx="198" cy="140" r="5"/><circle cx="282" cy="82" r="5"/></g>
    <g fill="#e7f3fe"><rect x="56" y="188" width="238" height="38" rx="8"/></g>
    <g fill="#1f8ae6"><rect x="64" y="204" width="120" height="6" rx="3"/></g>
    <g fill="#e5e7eb"><rect x="56" y="234" width="52" height="30" rx="8"/><rect x="116" y="234" width="52" height="30" rx="8"/><rect x="176" y="234" width="52" height="30" rx="8"/><rect x="236" y="234" width="58" height="30" rx="8"/></g>
    <g fill="#fff7df"><rect x="56" y="272" width="238" height="42" rx="8"/></g>
    <g fill="#ffc23d"><circle cx="76" cy="293" r="9"/><circle cx="104" cy="293" r="9"/><circle cx="132" cy="293" r="9"/></g>
    <text x="175" y="365" font-size="18" font-weight="800" fill="#1b2330" text-anchor="middle">Crowded: many small targets</text>
    <!-- simple -->
    <rect x="410" y="20" width="270" height="310" rx="26" fill="#ffffff" stroke="#1b2330" stroke-width="3"/>
    <text x="545" y="58" font-size="18" font-weight="800" fill="#6b7484" text-anchor="middle">Today's practice</text>
    <rect x="428" y="72" width="234" height="96" rx="14" fill="#e8f7ea" stroke="#3cb44b" stroke-width="2"/>
    <circle cx="468" cy="120" r="24" fill="#3cb44b"/>
    <text x="570" y="116" font-size="24" font-weight="900" fill="#1b2330" text-anchor="middle">Warm up</text>
    <text x="570" y="146" font-size="18" font-weight="700" fill="#1b2330" text-anchor="middle">1 of 3 done today</text>
    <rect x="428" y="188" width="234" height="72" rx="16" fill="#3cb44b"/>
    <rect x="428" y="188" width="234" height="72" rx="16" fill="none" stroke="#2b8a37" stroke-width="3"/>
    <text x="545" y="238" font-size="34" font-weight="900" fill="#ffffff" text-anchor="middle">Start</text>
    <rect x="428" y="272" width="234" height="44" rx="14" fill="#ffffff" stroke="#e5e7eb" stroke-width="3"/>
    <text x="545" y="301" font-size="19" font-weight="800" fill="#6b7484" text-anchor="middle">See everything</text>
    <text x="545" y="365" font-size="18" font-weight="800" fill="#1b2330" text-anchor="middle">Simple mode: one next step</text>
  </g>
